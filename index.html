<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Eşarp ve Şal Dünyası - Zarif, zamansız ve özenle seçilmiş eşarp ve şallar.">

<title>Eşarp & Şal | Premium Collection</title>

<style>
:root{
  --ink:#281d1a;
  --brown:#51352d;
  --brown2:#765147;
  --gold:#b58a52;
  --cream:#f6eee6;
  --paper:#fffaf6;
  --soft:#eadbd0;
  --line:rgba(45,33,30,.13);
  --green:#25d366;
  --shadow:0 20px 60px rgba(48,30,24,.14);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--ink);
  overflow-x:hidden;
}

body.no-scroll{
  overflow:hidden;
}

button,
input{
  font:inherit;
}

a{
  color:inherit;
}

/* LOADER */

.loader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:grid;
  place-items:center;
  background:#2a1e1a;
  color:#f6e8da;
  transition:.6s ease;
}

.loader.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-content{
  text-align:center;
}

.loader-logo{
  font:400 52px Georgia,serif;
}

.loader-sub{
  margin-top:12px;
  color:#c9a77d;
  font-size:9px;
  font-weight:bold;
  letter-spacing:.3em;
  text-transform:uppercase;
}

.loader-line{
  width:70px;
  height:1px;
  margin:25px auto 0;
  background:var(--gold);
}

/* ANNOUNCEMENT */

.announcement{
  position:relative;
  z-index:20;
  padding:10px;
  background:#2b1e1b;
  color:#f4e5d5;
  text-align:center;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.15em;
  text-transform:uppercase;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px clamp(18px,5vw,70px);
  background:rgba(247,240,232,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(15px);
}

.logo{
  text-decoration:none;
  font:400 30px Georgia,serif;
}

.logo small{
  display:block;
  margin-top:5px;
  color:#8b6d5d;
  font:700 8px Arial,sans-serif;
  letter-spacing:.3em;
  text-transform:uppercase;
}

nav{
  display:flex;
  align-items:center;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:#5a4740;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.1em;
  text-transform:uppercase;
}

nav a:hover{
  color:var(--gold);
}

.cart-button{
  border:0;
  padding:11px 17px;
  background:var(--ink);
  color:#fff;
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
}

.mobile-menu{
  display:none;
  border:0;
  background:none;
  font-size:27px;
  cursor:pointer;
}

/* HERO */

.hero{
  min-height:650px;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:70px;
  padding:90px clamp(20px,8vw,120px);
  background:
    radial-gradient(circle at 10% 15%,#fffaf5 0,transparent 35%),
    linear-gradient(115deg,#f4e7dc,#e4cdbd);
}

.hero-copy{
  max-width:650px;
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
  color:#8a654d;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.eyebrow:before{
  content:"";
  width:40px;
  height:1px;
  background:var(--gold);
}

.hero h1{
  margin:0 0 25px;
  font:400 clamp(55px,7vw,95px)/.9 Georgia,serif;
  letter-spacing:-.05em;
}

.hero h1 em{
  color:#77524b;
  font-style:normal;
}

.hero-copy p{
  max-width:520px;
  color:#66514a;
  font-size:17px;
  line-height:1.8;
}

.primary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:18px;
  padding:15px 24px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:#fff;
  text-decoration:none;
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.14em;
  text-transform:uppercase;
  transition:.25s;
}

.primary-btn:hover{
  background:#6c4a43;
  transform:translateY(-2px);
}

.hero-visual{
  position:relative;
  width:min(100%,440px);
  justify-self:center;
}

.hero-art{
  position:relative;
  height:500px;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 25%,#f1cfc5 0 12%,transparent 13%),
    radial-gradient(circle at 75% 70%,#9c6259 0 18%,transparent 19%),
    linear-gradient(145deg,#70443e,#d2a08d 50%,#795047);
  box-shadow:25px 28px 60px rgba(71,48,40,.18);
}

.hero-art:before{
  content:"";
  position:absolute;
  inset:10%;
  border:1px solid rgba(255,255,255,.35);
  transform:rotate(12deg);
}

.hero-art:after{
  content:"EŞARP";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-12deg);
  color:rgba(255,248,241,.65);
  font:italic 65px Georgia,serif;
}

.seal{
  position:absolute;
  right:-25px;
  bottom:35px;
  width:105px;
  height:105px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#f4e6d7;
  border:1px solid var(--line);
  color:#6d4e43;
  text-align:center;
  font:italic 15px Georgia,serif;
  box-shadow:0 15px 35px rgba(62,38,30,.12);
}

/* TRUST */

.trust{
  position:relative;
  z-index:5;
  max-width:1100px;
  margin:-1px auto 0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.trust-item{
  padding:27px;
  border-right:1px solid var(--line);
}

.trust-item:last-child{
  border-right:0;
}

.trust-icon{
  margin-bottom:10px;
  color:var(--gold);
  font-size:21px;
}

.trust-item strong{
  display:block;
  margin-bottom:7px;
  font:400 17px Georgia,serif;
}

.trust-item span{
  color:#806c62;
  font-size:12px;
  line-height:1.6;
}

/* SECTIONS */

.products,
.why,
.reviews,
.experience,
.gift{
  padding:100px 20px;
}

.products{
  background:var(--cream);
}

.section-heading{
  max-width:1100px;
  margin:0 auto 45px;
  padding-bottom:25px;
  border-bottom:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr auto;
  gap:25px;
  align-items:end;
}

.section-heading small,
.center-heading small,
.gift-copy small,
.contact-banner small{
  color:#98734d;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.section-heading h2,
.center-heading h2{
  margin:10px 0 0;
  font:400 clamp(40px,5vw,64px) Georgia,serif;
}

.section-heading p{
  max-width:330px;
  margin:0;
  color:#806d63;
  line-height:1.7;
  font-size:14px;
}

/* PRODUCTS */

.product-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
}

.product:nth-child(2){
  margin-top:50px;
}

.product-image{
  position:relative;
  height:410px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.product-image:hover{
  transform:translateY(-5px);
}

.product-image:before{
  content:"";
  position:absolute;
  inset:12%;
  border:1px solid rgba(255,255,255,.35);
  transform:rotate(18deg);
}

.product-image.one{
  background:
    radial-gradient(circle at 25% 25%,#f2cfc7 0 12%,transparent 13%),
    radial-gradient(circle at 75% 70%,#9c6059 0 17%,transparent 18%),
    linear-gradient(145deg,#713f3b,#d59c91);
}

.product-image.two{
  background:
    radial-gradient(circle at 70% 25%,#e6c6a1 0 14%,transparent 15%),
    radial-gradient(circle at 25% 75%,#8b6549 0 17%,transparent 18%),
    linear-gradient(145deg,#5b493b,#c6a27d);
}

.product-image.three{
  background:
    radial-gradient(circle at 30% 65%,#d7b9c9 0 15%,transparent 16%),
    radial-gradient(circle at 75% 25%,#8c687c 0 15%,transparent 16%),
    linear-gradient(145deg,#54404d,#b797a8);
}

.product-image.four{
  background:
    radial-gradient(circle at 25% 25%,#f0c7a5 0 14%,transparent 15%),
    radial-gradient(circle at 75% 70%,#8a5547 0 16%,transparent 17%),
    linear-gradient(145deg,#684237,#c99577);
}

.product-badge{
  position:absolute;
  top:15px;
  left:15px;
  z-index:2;
  padding:8px 11px;
  background:#fffaf5;
  color:#765147;
  font-size:8px;
  font-weight:bold;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.product-info{
  padding:20px 4px;
}

.product-info h3{
  margin:0 0 8px;
  font:400 24px Georgia,serif;
}

.product-info p{
  color:#806d63;
  line-height:1.6;
}

.price{
  color:var(--ink)!important;
  font:400 21px Georgia,serif;
}

.stock{
  font-size:10px!important;
  font-weight:bold;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.product-actions{
  display:grid;
  grid-template-columns:1fr 48px;
  gap:8px;
}

.product-action,
.quick-view{
  padding:13px;
  border:1px solid var(--ink);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.product-action:hover{
  background:var(--ink);
  color:white;
}

.quick-view{
  border-color:var(--line);
  background:#f8eee7;
  font-size:18px;
}

/* WHY */

.why{
  background:#f0e2d7;
}

.center-heading{
  margin:0 auto 55px;
  text-align:center;
}

.center-heading p{
  max-width:600px;
  margin:auto;
  color:#76625a;
  line-height:1.7;
}

.why-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.why-card{
  padding:35px 25px;
  background:rgba(255,250,246,.75);
  border:1px solid rgba(80,55,45,.1);
  text-align:center;
  transition:.3s;
}

.why-card:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.why-card .icon{
  margin-bottom:17px;
  color:var(--gold);
  font-size:28px;
}

.why-card h3{
  margin:0 0 10px;
  font:400 20px Georgia,serif;
}

.why-card p{
  margin:0;
  color:#806d63;
  font-size:13px;
  line-height:1.7;
}

/* EDITORIAL */

.editorial{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  min-height:540px;
  background:#3a2925;
  color:#f5eadd;
}

.editorial-image{
  background:
    radial-gradient(circle at 25% 30%,#c49b76 0 14%,transparent 15%),
    radial-gradient(circle at 70% 65%,#745043 0 20%,transparent 21%),
    linear-gradient(145deg,#6a473c,#bd8f6f);
}

.editorial-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px;
}

.editorial-copy small{
  color:#c6a879;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.editorial-copy h2{
  margin:20px 0;
  font:400 clamp(42px,5vw,68px)/1 Georgia,serif;
}

.editorial-copy p{
  max-width:520px;
  color:#d8c9bf;
  line-height:1.9;
}

.editorial-copy .primary-btn{
  width:max-content;
  background:#f5eadd;
  color:#3a2925;
}

/* GIFT */

.gift{
  background:#fffaf6;
}

.gift-inner{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:55px;
  align-items:center;
}

.gift-image{
  min-height:370px;
  background:
    radial-gradient(circle at 35% 30%,#e7b7b0 0 15%,transparent 16%),
    radial-gradient(circle at 70% 70%,#795048 0 20%,transparent 21%),
    linear-gradient(145deg,#70473e,#c99884);
  box-shadow:var(--shadow);
}

.gift-copy h2{
  margin:15px 0;
  font:400 clamp(40px,5vw,60px) Georgia,serif;
}

.gift-copy p{
  color:#76625a;
  line-height:1.8;
}

.gift-check{
  display:flex;
  align-items:center;
  gap:12px;
  margin:22px 0;
  color:#5d4942;
  font-size:13px;
}

.gift-check input{
  width:18px;
  height:18px;
  accent-color:var(--brown);
}

/* REVIEWS */

.reviews{
  background:#eadbd0;
}

.reviews-grid{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.review{
  padding:32px;
  background:#fffaf6;
  border:1px solid var(--line);
}

.stars{
  color:#b58a52;
  letter-spacing:4px;
}

.review p{
  color:#66534b;
  line-height:1.8;
}

.review strong{
  font:400 18px Georgia,serif;
}

/* EXPERIENCE */

.experience{
  background:#fbf5ef;
}

.experience-heading{
  max-width:1050px;
  margin:0 auto 60px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:end;
}

.experience-heading small{
  color:#a17b52;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.25em;
  text-transform:uppercase;
}

.experience-heading h2{
  margin:12px 0 0;
  font:400 clamp(42px,5vw,68px)/.95 Georgia,serif;
}

.experience-heading p{
  color:#76635b;
  line-height:1.8;
}

.experience-grid{
  max-width:1050px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.experience-card{
  min-height:280px;
  padding:35px 28px;
  border-right:1px solid var(--line);
}

.experience-card:last-child{
  border-right:0;
}

.experience-number{
  display:block;
  margin-bottom:30px;
  color:#b28a54;
  font-size:11px;
  font-weight:bold;
}

.experience-icon{
  margin-bottom:18px;
  color:#8a624d;
  font:25px Georgia,serif;
}

.experience-card h3{
  margin:0 0 12px;
  font:400 22px Georgia,serif;
}

.experience-card p{
  margin:0;
  color:#78655c;
  font-size:13px;
  line-height:1.7;
}

/* SIGNATURE */

.signature{
  padding:120px 20px;
  background:#382824;
  color:#f5e9df;
  text-align:center;
}

.signature-inner{
  max-width:700px;
  margin:auto;
}

.signature-line{
  display:block;
  width:45px;
  height:1px;
  margin:0 auto 22px;
  background:#c5a06e;
}

.signature small{
  color:#c8a878;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.25em;
  text-transform:uppercase;
}

.signature h2{
  margin:25px 0;
  font:400 clamp(45px,6vw,76px)/.95 Georgia,serif;
}

.signature p{
  max-width:500px;
  margin:0 auto 30px;
  color:#d3c3b8;
  line-height:1.9;
}

/* CONTACT */

.contact-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:40px;
  padding:80px max(20px,8vw);
  background:#eadbd0;
}

.contact-banner h2{
  margin:12px 0 18px;
  font:400 clamp(38px,4vw,56px) Georgia,serif;
}

.contact-banner p{
  max-width:550px;
  margin:0;
  color:#705b52;
  line-height:1.8;
}

.contact-whatsapp{
  flex-shrink:0;
  min-width:245px;
  padding:24px 30px;
  background:#4b332b;
  color:#fff;
  text-decoration:none;
  transition:.25s;
}

.contact-whatsapp:hover{
  background:#2e211d;
  transform:translateY(-3px);
}

.contact-whatsapp span{
  display:block;
  margin-bottom:6px;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.contact-whatsapp strong{
  font:400 22px Georgia,serif;
}

/* FOOTER */

footer{
  padding:70px max(20px,8vw) 25px;
  background:#241a17;
  color:#eaded4;
}

.footer-brand h3{
  margin:0 0 10px;
  font:400 30px Georgia,serif;
}

.footer-brand p{
  margin:0;
  color:#a99a91;
  font-size:13px;
}

.footer-links{
  display:grid;
  grid-template-columns:1fr 1fr;
  max-width:500px;
  margin:50px 0;
  gap:70px;
}

.footer-links h4{
  margin:0 0 17px;
  color:#c4a16f;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.footer-links a{
  display:block;
  width:max-content;
  margin-bottom:10px;
  color:#bcaea6;
  text-decoration:none;
  font-size:13px;
}

.footer-links a:hover{
  color:#fff;
}

.footer-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding-top:25px;
  border-top:1px solid rgba(255,255,255,.1);
  color:#8f8179;
  font-size:11px;
}

.footer-social{
  display:flex;
  gap:15px;
}

.footer-social a{
  color:#bcaea6;
  text-decoration:none;
}

.footer-social a:hover{
  color:#c4a16f;
}

/* WHATSAPP */

.whatsapp-float{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9000;
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  text-decoration:none;
  font-size:25px;
  box-shadow:0 10px 30px rgba(37,211,102,.3);
}

/* CART */

.cart-overlay{
  position:fixed;
  inset:0;
  z-index:9998;
  background:rgba(30,20,17,.5);
  opacity:0;
  visibility:hidden;
  transition:.3s;
}

.cart-overlay.open{
  opacity:1;
  visibility:visible;
}

.cart-panel{
  position:fixed;
  top:0;
  right:0;
  z-index:9999;
  width:min(430px,92vw);
  height:100vh;
  padding:30px;
  display:flex;
  flex-direction:column;
  background:#fffaf6;
  box-shadow:-20px 0 60px rgba(40,25,20,.2);
  transform:translateX(105%);
  transition:.35s ease;
}

.cart-panel.open{
  transform:translateX(0);
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
}

.cart-header h3{
  margin:0;
  font:400 27px Georgia,serif;
}

.cart-close{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  background:none;
  cursor:pointer;
  font-size:20px;
}

.cart-items{
  flex:1;
  overflow:auto;
  padding:20px 0;
}

.empty-cart{
  padding:60px 10px;
  text-align:center;
  color:#806d63;
  line-height:1.7;
}

.cart-item{
  display:grid;
  grid-template-columns:60px 1fr auto;
  gap:14px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.cart-thumb{
  width:60px;
  height:70px;
  background:linear-gradient(145deg,#795047,#d3a28e);
}

.cart-item h4{
  margin:0 0 6px;
  font:400 17px Georgia,serif;
}

.cart-item-price{
  color:#806d63;
  font-size:12px;
}

.cart-remove{
  border:0;
  background:none;
  color:#98734d;
  cursor:pointer;
}

.cart-footer{
  padding-top:20px;
  border-top:1px solid var(--line);
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
}

.cart-total span{
  color:#806d63;
  font-size:12px;
  text-transform:uppercase;
}

.cart-total strong{
  font:400 24px Georgia,serif;
}

.checkout-btn{
  width:100%;
  padding:16px;

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:10000;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(35,24,20,.65);
  opacity:0;
  visibility:hidden;
  transition:.3s;
}

.modal.open{
  opacity:1;
  visibility:visible;
}

.modal-box{
  position:relative;
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#fffaf6;
}

.modal-image{
  min-height:500px;
  background:linear-gradient(145deg,#713f3b,#d59c91);
}

.modal-content{
  align-self:center;
  padding:45px;
}

.modal-content small{
  color:#98734d;
  font-size:9px;
  font-weight:bold;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.modal-content h2{
  margin:15px 0;
  font:400 38px Georgia,serif;
}

.modal-content p{
  color:#76635b;
  line-height:1.8;
}

.modal-price{
  margin:25px 0;
  font:400 25px Georgia,serif;
}

.modal-close{
  position:absolute;
  top:15px;
  right:15px;
  z-index:2;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:#fffaf6;
  cursor:pointer;
  font-size:20px;
}

<script>

/* =========================
   LOADER
========================= */

window.addEventListener("load", function(){

  const loader = document.getElementById("loader");

  setTimeout(function(){

    loader.classList.add("hide");

    document.body.classList.remove("loading");

  }, 900);

});


/* =========================
   MOBILE MENU
========================= */

function toggleMenu(){

  const nav = document.getElementById("nav");

  nav.classList.toggle("open");

}


/* =========================
   CART
========================= */

let cart = [];


function addToCart(name, price){

  const existing = cart.find(function(item){

    return item.name === name;

  });


  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name: name,
      price: price,
      qty: 1

    });

  }


  updateCart();


  const panel =
    document.getElementById("cartPanel");

  const overlay =
    document.getElementById("cartOverlay");


  panel.classList.add("open");

  overlay.classList.add("open");

}


function updateCart(){

  const cartItems =
    document.getElementById("cartItems");

  const cartCount =
    document.getElementById("cartCount");

  const cartTotal =
    document.getElementById("cartTotal");


  let count = 0;

  let total = 0;


  cart.forEach(function(item){

    count += item.qty;

    total += item.price * item.qty;

  });


  cartCount.textContent = count;


  cartTotal.textContent =
    total.toLocaleString("tr-TR") + " TL";


  if(cart.length === 0){

    cartItems.innerHTML = `
      <div class="empty-cart">
        Sepetiniz şu anda boş.<br>
        Koleksiyondan bir parça seçebilirsiniz.
      </div>
    `;

    return;

  }


  cartItems.innerHTML = cart.map(function(item,index){

    return `

      <div class="cart-item">

        <div class="cart-thumb"></div>

        <div>

          <h4>
            ${item.name}
          </h4>

          <div class="cart-item-price">
            ${item.qty} ×
            ${item.price.toLocaleString("tr-TR")} TL
          </div>

        </div>

        <button
          class="cart-remove"
          onclick="removeFromCart(${index})"
        >
          Sil
        </button>

      </div>

    `;

  }).join("");

}


function removeFromCart(index){

  cart.splice(index, 1);

  updateCart();

}


function toggleCart(){

  const panel =
    document.getElementById("cartPanel");

  const overlay =
    document.getElementById("cartOverlay");


  panel.classList.toggle("open");

  overlay.classList.toggle("open");

}


/* =========================
   WHATSAPP CHECKOUT
========================= */

function checkout(){

  if(cart.length === 0){

    alert("Sepetiniz boş.");

    return;

  }


  let message =
    "Merhaba, sipariş vermek istiyorum:\n\n";


  cart.forEach(function(item){

    message +=
      "• " +
      item.name +
      " x" +
      item.qty +
      " — " +
      (
        item.price * item.qty
      ).toLocaleString("tr-TR") +
      " TL\n";

  });


  const total = cart.reduce(
    function(sum,item){

      return sum +
        item.price * item.qty;

    },
    0
  );


  message +=
    "\nToplam: " +
    total.toLocaleString("tr-TR") +
    " TL";


  const whatsappURL =
    "https://wa.me/905555555555?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}


/* =========================
   MODAL
========================= */

let selectedProduct = null;


function openModal(
  title,
  price,
  description
){

  selectedProduct = {

    title: title,
    price: price,
    description: description

  };


  document.getElementById(
    "modalTitle"
  ).textContent = title;


  document.getElementById(
    "modalPrice"
  ).textContent = price;


  document.getElementById(
    "modalDescription"
  ).textContent = description;


  document.getElementById(
    "productModal"
  ).classList.add("open");


  document.body.style.overflow =
    "hidden";


  document.getElementById(
    "modalAddButton"
  ).onclick = function(){

    const numericPrice =
      parseInt(
        price
          .replace(/\./g,"")
          .replace(" TL","")
      );


    addToCart(
      title,
      numericPrice
    );


    closeModal();

  };

}


function closeModal(event){

  if(
    event &&
    event.target !==
    document.getElementById("productModal")
  ){

    return;

  }


  document.getElementById(
    "productModal"
  ).classList.remove("open");


  document.body.style.overflow = "";

}


/* =========================
   ESCAPE
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      document.getElementById(
        "productModal"
      ).classList.remove("open");


      document.getElementById(
        "cartPanel"
      ).classList.remove("open");


      document.getElementById(
        "cartOverlay"
      ).classList.remove("open");


      document.body.style.overflow = "";

    }

  }
);


/* =========================
   NAV CLOSE
========================= */

document
  .querySelectorAll("nav a")
  .forEach(function(link){

    link.addEventListener(
      "click",
      function(){

        document
          .getElementById("nav")
          .classList.remove("open");

      }
    );

  });

========================= */

const giftCheck =

if(giftCheck){

          "Sipariş sırasında WhatsApp üzerinden " +
          "detayları iletebilirsiniz."
        );

      }

    }
  );

}


/* =========================
   CLOSE MENU ON RESIZE
========================= */

window.addEventListener(
  "resize",
  function(){

    if(window.innerWidth > 900){

      document
        .getElementById("nav")
        .classList.remove("open");

    }

  }
);

</script>
