<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Eşarp ve Şal Dünyası — Zarif, zamansız ve özenle seçilmiş eşarp ve şallar.">

  <title>Eşarp ve Şal Dünyası | Premium Koleksiyon</title>

  <style>
    :root {
      --ink: #281d1a;
      --brown: #51352d;
      --brown-light: #765147;
      --gold: #b58a52;
      --gold-light: #d7b98b;
      --cream: #f6eee6;
      --paper: #fffaf6;
      --soft: #eadbd0;
      --white: #fff;
      --green: #25d366;
      --dark: #2b1e1b;
      --line: rgba(45, 33, 30, .13);
      --shadow: 0 25px 70px rgba(48, 30, 24, .14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    body.loading {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    /* =========================
       LOADER
    ========================= */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      background: #2a1e1a;
      color: #f6e8da;
      transition: opacity .7s ease, visibility .7s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-inner {
      text-align: center;
      animation: loaderReveal 1s ease both;
    }

    .loader-logo {
      font: 400 clamp(34px, 7vw, 64px) Georgia, serif;
      letter-spacing: -.04em;
    }

    .loader-sub {
      margin-top: 12px;
      color: #c9a77d;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .35em;
      text-transform: uppercase;
    }

    .loader-line {
      width: 80px;
      height: 1px;
      margin: 28px auto 0;
      background: var(--gold);
      animation: loaderLine 1.5s ease infinite;
    }

    @keyframes loaderReveal {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes loaderLine {
      0%, 100% {
        transform: scaleX(.3);
        opacity: .4;
      }

      50% {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    /* =========================
       PETALS
    ========================= */

    .petals {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -60px;
      width: 12px;
      height: 18px;
      border-radius: 80% 15% 80% 15%;
      background: linear-gradient(135deg, #fff8f3, #d8a9a5);
      opacity: .55;
      animation: fall linear infinite;
    }

    .petal:nth-child(1) {
      left: 4%;
      animation-duration: 12s;
      animation-delay: -3s;
    }

    .petal:nth-child(2) {
      left: 12%;
      animation-duration: 16s;
      animation-delay: -8s;
      transform: scale(.7);
    }

    .petal:nth-child(3) {
      left: 23%;
      animation-duration: 13s;
      animation-delay: -5s;
      transform: scale(.55);
    }

    .petal:nth-child(4) {
      left: 34%;
      animation-duration: 18s;
      animation-delay: -11s;
    }

    .petal:nth-child(5) {
      left: 47%;
      animation-duration: 14s;
      animation-delay: -2s;
      transform: scale(.8);
    }

    .petal:nth-child(6) {
      left: 58%;
      animation-duration: 19s;
      animation-delay: -7s;
    }

    .petal:nth-child(7) {
      left: 70%;
      animation-duration: 15s;
      animation-delay: -9s;
      transform: scale(.65);
    }

    .petal:nth-child(8) {
      left: 81%;
      animation-duration: 17s;
      animation-delay: -4s;
    }

    .petal:nth-child(9) {
      left: 91%;
      animation-duration: 13s;
      animation-delay: -6s;
      transform: scale(.75);
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -80px, 0) rotate(0deg);
      }

      25% {
        transform: translate3d(45px, 25vh, 0) rotate(100deg);
      }

      50% {
        transform: translate3d(-40px, 50vh, 0) rotate(220deg);
      }

      75% {
        transform: translate3d(60px, 75vh, 0) rotate(300deg);
      }

      100% {
        transform: translate3d(-30px, 110vh, 0) rotate(430deg);
      }
    }

    /* =========================
       ANNOUNCEMENT
    ========================= */

    .announcement {
      position: relative;
      z-index: 20;
      overflow: hidden;
      background: var(--dark);
      color: #f4e5d5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .announcement-track {
      display: flex;
      width: max-content;
      animation: marquee 28s linear infinite;
    }

    .announcement-track span {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 10px 30px;
    }

    .announcement-track i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%);
      }
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      padding: 17px clamp(18px, 5vw, 72px);
      background: rgba(247, 240, 232, .93);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .logo {
      text-decoration: none;
      font: 400 clamp(21px, 2.2vw, 31px)/1 Georgia, serif;
      letter-spacing: -.03em;
    }

    .logo small {
      display: block;
      margin-top: 6px;
      color: #8b6d5d;
      font: 700 8px/1 "Segoe UI", Arial, sans-serif;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2vw, 27px);
    }

    nav a {
      text-decoration: none;
      color: #5a4740;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: color .2s;
    }

    nav a:hover {
      color: var(--gold);
    }

    .cart-button {
      border: 0;
      padding: 11px 17px;
      background: var(--ink);
      color: white;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: .25s;
    }

    .cart-button:hover {
      background: var(--brown-light);
      transform: translateY(-2px);
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      z-index: 2;
      min-height: 700px;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: clamp(40px, 7vw, 100px);
      padding: clamp(55px, 8vw, 105px) clamp(20px, 8vw, 120px);
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, #fffaf5 0, transparent 34%),
        linear-gradient(115deg, #f4e7dc, #e4cdbd);
    }

    .hero-copy {
      max-width: 680px;
      animation: heroText 1.2s .3s ease both;
    }

    @keyframes heroText {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 24px;
      color: #8a654d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .23em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 42px;
      height: 1px;
      background: var(--gold);
    }

    .hero h1 {
      margin: 0 0 24px;
      font: 400 clamp(54px, 7vw, 100px)/.88 Georgia, serif;
      letter-spacing: -.055em;
    }

    .hero h1 em {
      color: #77524b;
      font-style: normal;
    }

    .hero-copy p {
      max-width: 510px;
      color: #66514a;
      font-size: 17px;
      line-height: 1.75;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      padding: 16px 25px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .25s;
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      background: #6c4a43;
      box-shadow: 0 10px 25px rgba(43, 30, 27, .15);
    }

    .hero-visual {
      position: relative;
      width: min(100%, 440px);
      justify-self: center;
      animation: heroImage 1.2s .5s ease both;
    }

    @keyframes heroImage {
      from {
        opacity: 0;
        transform: translateX(35px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .hero-visual::before {
      content: "";
      position: absolute;
      inset: -24px 35px 28px -26px;
      border: 1px solid rgba(112, 76, 64, .3);
    }

    .hero-visual img {
      position: relative;
      display: block;
      width: 100%;
      height: 510px;
      object-fit: cover;
      object-position: center 20%;
      box-shadow: 25px 28px 60px rgba(71, 48, 40, .18);
    }

    .seal {
      position: absolute;
      right: -32px;
      bottom: 38px;
      z-index: 2;
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      text-align: center;
      background: #f4e6d7;
      border: 1px solid var(--line);
      color: #6d4e43;
      font: italic 16px Georgia, serif;
      transform: rotate(-8deg);
      box-shadow: 0 15px 35px rgba(62, 38, 30, .12);
    }

    /* =========================
       TRUST
    ========================= */

    .trust {
      position: relative;
      z-index: 3;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .trust-item {
      padding: 27px 28px;
      border-right: 1px solid var(--line);
    }

    .trust-item:last-child {
      border-right: 0;
    }

    .trust-icon {
      margin-bottom: 12px;
      color: var(--gold);
      font-size: 20px;
    }

    .trust-item strong {
      display: block;
      margin-bottom: 7px;
      font: 400 17px Georgia, serif;
    }

    .trust-item span {
      color: #806c62;
      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products {
      position: relative;
      z-index: 2;
      padding: 110px 20px 120px;
    }

    .section-heading {
      max-width: 1100px;
      margin: 0 auto 45px;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 25px;
      align-items: end;
    }

    .section-heading small,
    .center-heading small {
      color: #98734d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .section-heading h2 {
      margin: 9px 0 0;
      font: 400 clamp(40px, 5vw, 64px)/1 Georgia, serif;
    }

    .section-heading p {
      max-width: 330px;
      margin: 0;
      color: #806d63;
      line-height: 1.65;
      font-size: 14px;
    }

    .product-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .product:nth-child(2) {
      margin-top: 58px;
    }

    .product-image {
      position: relative;
      height: 410px;
      overflow: hidden;
      background: #e3d4ca;
      cursor: pointer;
    }

    .product-image::after {
      content: "Hızlı İncele";
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translate(-50%, 20px);
      padding: 10px 16px;
      background: rgba(255, 250, 246, .93);
      color: var(--ink);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: 0;
      transition: .3s;
    }

    .product:hover .product-image::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .product-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(.84);
      transition: transform .7s cubic-bezier(.2, .7, .2, 1), filter .3s;
    }

    .product:hover .product-image img {
      transform: scale(1.055);
      filter: saturate(1);
    }

    .product-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 2;
      padding: 8px 11px;
      background: #fffaf5;
      color: #765147;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .product-info {
      padding: 21px 4px 0;
    }

    .product-info h3 {
      margin: 0 0 9px;
      font: 400 24px Georgia, serif;
    }

    .product-info p {
      color: #806d63;
      line-height: 1.6;
    }

    .price {
      margin: 0 0 6px;
      color: var(--ink) !important;
      font: 400 21px Georgia, serif;
    }

    .stock {
      margin: 0 0 15px;
      color: #806d63 !important;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .product-action {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: .2s;
    }

    .product-action:hover {
      background: var(--ink);
      color: white;
    }

    .quick-view {
      width: 46px;
      border: 1px solid var(--line);
      background: #f8eee7;
      cursor: pointer;
      color: var(--brown);
    }

    /* =========================
       WHY
    ========================= */

    .why {
      padding: 105px 20px;
      background: #f0e2d7;
    }

    .center-heading {
      text-align: center;
      margin-bottom: 55px;
    }

    .center-heading h2 {
      margin: 12px 0;
      font: 400 clamp(40px, 5vw, 62px) Georgia, serif;
    }

    .center-heading p {
      max-width: 600px;
      margin: auto;
      color: #76625a;
      line-height: 1.7;
    }

    .why-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .why-card {
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 250, 246, .75);
      border: 1px solid rgba(80, 55, 45, .1);
      transition: .3s;
    }

    .why-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
    }

    .why-card .icon {
      margin-bottom: 17px;
      color: var(--gold);
      font-size: 29px;
    }

    .why-card h3 {
      margin: 0 0 10px;
      font: 400 20px Georgia, serif;
    }

    .why-card p {
      margin: 0;
      color: #806d63;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       EDITORIAL
    ========================= */

    .editorial {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      min-height: 550px;
      background: #3a2925;
      color: #f5eadd;
    }

    .editorial-image {
      min-height: 550px;
      background: url("assets/products/kahve-tonlari-esarp.jpg") center 34% / cover;
      filter: saturate(.7) sepia(.1);
    }

    .editorial-copy {
      display: grid;
      align-content: center;
      padding: clamp(50px, 8vw, 110px);
    }

    .editorial-copy small {
      color: #c6a879;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: 10px;
    }

    .editorial-copy h2 {
      margin: 20px 0 22px;
      font: 400 clamp(42px, 5vw, 70px)/.98 Georgia, serif;
    }

    .editorial-copy p {
      max-width: 520px;
      color: #d8c9bf;
      line-height: 1.9;
    }

    .editorial-copy .primary-btn {
      width: max-content;
      background: #f5eadd;
      color: #3a2925;
      border-color: #f5eadd;
    }

    /* =========================
       EXPERIENCE
    ========================= */

    .experience {
      padding: 120px 20px;
      background: #fbf5ef;
    }

    .experience-heading {
      max-width: 1050px;
      margin: 0 auto 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: end;
    }

    .experience-heading small {
      color: #a17b52;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .25em;
      text-transform: uppercase;
    }

    .experience-heading h2 {
      margin: 12px 0 0;
      font: 400 clamp(42px, 5vw, 68px)/.95 Georgia, serif;
      color: #332521;
      letter-spacing: -.04em;
    }

    .experience-heading p {
      max-width: 420px;
      margin: 0;
      color: #76635b;
      font-size: 15px;
      line-height: 1.8;
    }

    .experience-grid {
      max-width: 1050px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .experience-card {
      min-height: 290px;
      padding: 35px 28px;
      border-right: 1px solid var(--line);
      transition: .3s;
    }

    .experience-card:last-child {
      border-right: 0;
    }

    .experience-card:hover {
      background: #f2e6dc;
      transform: translateY(-4px);
    }

    .experience-number {
      display: block;
      margin-bottom: 35px;
      color: #b28a54;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
    }

    .experience-icon {
      margin-bottom: 20px;
      color: #8a624d;
      font: 25px Georgia, serif;
    }

    .experience-card h3 {
      margin: 0 0 12px;
      font: 400 22px Georgia, serif;
    }

    .experience-card p {
      margin: 0;
      color: #78655c;
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       GIFT
    ========================= */

    .gift {
      padding: 100px 20px;
      background: #fffaf6;
    }

    .gift-inner {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 55px;
      align-items: center;
    }

    .gift-image {
      min-height: 370px;
      background:
        linear-gradient(rgba(65, 43, 36, .15), rgba(65, 43, 36, .15)),
        url("assets/products/gul-bahcesi-sal.webp") center / cover;
      box-shadow: var(--shadow);
    }

    .gift-copy small {
      color: #98734d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .gift-copy h2 {
      margin: 15px 0;
      font: 400 clamp(40px, 5vw, 60px) Georgia, serif;
    }

    .gift-copy p {
      color: #76625a;
      line-height: 1.8;
    }

    .gift-check {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      font-size: 13px;
      color: #5d4942;
    }

    .gift-check input {
      width: 18px;
      height: 18px;
      accent-color: var(--brown);
    }

    /* =========================
       REVIEWS
    ========================= */

    .reviews {
      padding: 105px 20px;
      background: #eadbd0;
    }

    .reviews-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .review {
      padding: 32px;
      background: #fffaf6;
      border: 1px solid var(--line);
    }

    .stars {
      color: #b58a52;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    .review p {
      color: #66534b;
      line-height: 1.8;
      font-size: 14px;
    }

    .review strong {
      font: 400 18px Georgia, serif;
    }

    /* =========================
       INSTAGRAM
    ========================= */

    .instagram {
      padding: 100px 20px;
      text-align: center;
      background: #f7efe8;
    }

    .instagram-grid {
      max-width: 1000px;
      margin: 45px auto 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .insta-card {
      aspect-ratio: 1;
      overflow: hidden;
      background: #ddd;
    }

    .insta-card img {
      width: 100%;
      height: 100%;

    /* =========================
   CONTACT BANNER
========================= */

.contact-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:50px;
  padding:80px max(20px, 8vw);
  background:#eadbd0;
}

.contact-banner small{
  color:#99714d;
  font-size:10px;
  font-weight:800;
  letter-spacing:.22em;
}

.contact-banner h2{
  margin:12px 0 18px;
  font:400 clamp(38px,4vw,56px)/1 Georgia,serif;
  color:#332521;
}

.contact-banner p{
  max-width:550px;
  margin:0;
  color:#705b52;
  line-height:1.8;
}

.contact-whatsapp{
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:245px;
  padding:24px 30px;
  border:1px solid #4b332b;
  background:#4b332b;
  color:white;
  text-decoration:none;
  transition:.25s ease;
}

.contact-whatsapp:hover{
  background:#2e211d;
  transform:translateY(-3px);
}

.contact-whatsapp span{
  font-size:10px;
  font-weight:800;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.contact-whatsapp strong{
  font:400 22px Georgia,serif;
}


/* =========================
   FOOTER
========================= */

footer{
  padding:70px max(20px,8vw) 25px;
  background:#241a17;
  color:#eaded4;
  text-align:left;
}

.footer-brand h3{
  margin:0 0 10px;
  font:400 30px Georgia,serif;
}

.footer-brand p{
  margin:0;
  color:#a99a91;
  font-size:13px;
}

.footer-links{
  display:grid;
  grid-template-columns:1fr 1fr;
  max-width:500px;
  margin:50px 0;
  gap:70px;
}

.footer-links h4{
  margin:0 0 17px;
  color:#c4a16f;
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.footer-links a{
  display:block;
  width:max-content;
  margin-bottom:10px;
  color:#bcaea6;
  text-decoration:none;
  font-size:13px;
  transition:.2s;
}

.footer-links a:hover{
  color:white;
}

.footer-bottom{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding-top:25px;
  border-top:1px solid rgba(255,255,255,.1);
  color:#7f716b;
  font-size:11px;
}


/* =========================
   SABİT WHATSAPP
========================= */

.floating-whatsapp{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:1500;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 17px 12px 12px;
  border-radius:50px;
  background:#1f8f4d;
  color:white;
  text-decoration:none;
  box-shadow:0 10px 35px rgba(20,80,45,.3);
  transition:.25s ease;
}

.floating-whatsapp:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 40px rgba(20,80,45,.4);
}

.whatsapp-icon{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  font-size:17px;
}

.whatsapp-text{
  display:flex;
  flex-direction:column;
  font-size:12px;
  font-weight:800;
}

.whatsapp-text small{
  margin-top:2px;
  font-size:9px;
  font-weight:400;
  opacity:.8;
}

.whatsapp-pulse{
  position:absolute;
  inset:-4px;
  border:1px solid rgba(31,143,77,.45);
  border-radius:50px;
  animation:whatsappPulse 2.4s infinite;
}

@keyframes whatsappPulse{

  0%{
    opacity:.8;
    transform:scale(1);
  }

  70%{
    opacity:0;
    transform:scale(1.08);
  }

  100%{
    opacity:0;
    transform:scale(1.08);
  }

}


/* =========================
   MOBİL
========================= */

@media(max-width:800px){

  .experience-heading{
    grid-template-columns:1fr;
    gap:20px;
  }

  .experience-grid{
    grid-template-columns:1fr 1fr;
  }

  .experience-card{
    border-bottom:1px solid rgba(45,33,30,.13);
  }

  .experience-card:nth-child(2){
    border-right:0;
  }

  .experience-card:nth-child(3){
    border-bottom:0;
  }

  .experience-card:nth-child(4){
    border-right:0;
    border-bottom:0;
  }

  .contact-banner{
    flex-direction:column;
    align-items:flex-start;
  }

  .contact-whatsapp{
    width:100%;
  }

}


/* =========================
   KÜÇÜK EKRAN
========================= */

@media(max-width:550px){

  .experience{
    padding:80px 20px;
  }

  .experience-grid{
    grid-template-columns:1fr;
  }

  .experience-card,
  .experience-card:nth-child(2),
  .experience-card:nth-child(3),
  .experience-card:nth-child(4){
    border-right:0;
    border-bottom:1px solid rgba(45,33,30,.13);
  }

  .experience-card:last-child{
    border-bottom:0;
  }

  .signature{
    padding:90px 20px;
  }

  .footer-links{
    grid-template-columns:1fr;
    gap:30px;
  }

  .footer-bottom{
    flex-direction:column;
  }

  .floating-whatsapp{
    right:15px;
    bottom:15px;
  }

  .whatsapp-text{
    display:none;
  }

  .floating-whatsapp{
    width:50px;
    height:50px;
    padding:0;
    justify-content:center;
  }

  .whatsapp-pulse{
    border-radius:50%;
  }

}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }

  .petals{
    display:none;
  }

}


/* =========================
   LOADER KAPATMA
========================= */

.loader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

</style>


<!-- =========================
     LOADER JAVASCRIPT
========================= -->

<script>

document.addEventListener("DOMContentLoaded",function(){

  const loader=document.getElementById("loader");

  setTimeout(function(){

    if(loader){
      loader.classList.add("hide");
    }

    document.body.classList.remove("loading");

  },1000);

});

</script>
